#log option
#param1:level; param2:syslog; param3:timestamp; param4:funcline; param5:category;
log_option=3:1:0:1:ffffffff

# Controller's ALID
map_controller_alid=00:0c:43:88:88:88

# Has MAP agent on this device
map_agent=1

# This device is a MAP root
map_root=0

# Agent's ALID
map_agent_alid=00:0c:43:22:22:22

# Default Backhault Type
bh_type=eth

#Config Band setting of each Radio
radio_band=24G;5GL;5GH;

#bridge interface
br_inf=br-lan

#lan interface
lan=eth0

map_ver=R3

#qos capability
mscs_capa=0
scs_capa=0
qosmap_capa=0
dscppolicy_capa=0

#fixed al_mac of al_inf(only wifi inf) mac
#al_inf=ra0

bss_config_priority=ra0;ra1;ra2;ra3;apcli0;rax0;rax1;rax2;rax3;apclix0;rai0;rai1;rai2;rai3;apclii0

#ethernet device name used to read the switch table
#do not set if not understanding
#ethernet_dev_name=

decrypt_fail_threshold=10
gtk_rekey_interval=3600
#Enable Ethernet Onboarding on WAN PORT only
ob_wan_only=0
#emplus support function
#client_id and client_secret can be defined by yourself.
emplus_version=1.0
emplus_dev_metircs=1
emplus_dev_info=1
emplus_eth_status=1
emplus_stp_support=1
emplus_dpp_onboad=1
emplus_client_id=123
emplus_client_secret=456
emplus_product_class=0
emplus_role=0
guest_br_inf=brlan1
# Block BSS configuration mechanism
# emplus_client_secret=1: enable
# emplus_client_secret=0: disable
block_bss_autoconfig=0

#product info
ser_num=223333-768367373646
#1905_security=0
#BH_BSS_NAME=rai1
auto_role_sync_wts_file=0
